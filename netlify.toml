[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# ---------------------------------------------------------------------------
# Automatic WhatsApp reminders
#
# queue-auto-reminders inserts due reminders; process-whatsapp-queue drains the
# queue one message at a time per clinic, honouring the 5-10 minute anti-ban gap
# configured per clinic. Both need SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in
# the site environment, alongside the existing WHATSAPP_* vars.
# ---------------------------------------------------------------------------

[functions."queue-auto-reminders"]
  schedule = "0 * * * *"

[functions."process-whatsapp-queue"]
  schedule = "*/5 * * * *"

# Don't redirect these patterns - let them pass through to Vite
[[redirects]]
  from = "/src/*"
  to = "http://localhost:5173/src/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@vite/*"
  to = "http://localhost:5173/@vite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@react-refresh"
  to = "http://localhost:5173/@react-refresh"
  status = 200
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "http://localhost:5173/node_modules/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@id/*"
  to = "http://localhost:5173/@id/:splat"
  status = 200
  force = true

# Short branded path for stable PDF links: /r/<token>.pdf
#
# Every domain served by this site gets this rule, so a token resolves through
# whichever branded domain it was issued on (opdapp.anprohealthtech.com,
# docpreneur.academy, …). Which domain a clinic's links carry is chosen per
# clinic in clinic_settings.document_link_base, not by the browser origin.
#
# MUST stay above the SPA catch-all below. If the catch-all matches first the
# resolver never runs, index.html is served with a 200, and the link silently
# opens the app instead of the document — with no error anywhere to explain it.
#
# 302, not a 200 proxy: the resolver's own response is a redirect, and proxying
# a redirect is ill-defined. A proxy would also burn egress on every open.
#
# THIS FILE IS THE ONLY PLACE THIS RULE MAY LIVE. Netlify applies netlify.toml
# redirects BEFORE public/_redirects, so a copy of this rule there is dead
# config that looks live — edit it, deploy, and nothing changes, because the
# rule below still wins. The project ref is hardcoded (netlify.toml is not
# processed by Vite, so import.meta.env / ${VAR} do not work here), and nothing
# type-checks or build-fails if it goes stale. If old WhatsApp links stop
# resolving after a project migration, look here FIRST.
#
# 2026-08-25: repointed from nxbzrpmlnlvknmutyher (Sydney) to
# kiezgfhonvwryxpubfvl (Mumbai), matching VITE_SUPABASE_URL.
[[redirects]]
  from = "/r/*"
  to = "https://kiezgfhonvwryxpubfvl.supabase.co/functions/v1/doc-link/:splat"
  status = 302
  force = true

# SPA fallback - only for HTML navigation.
# Public booking URLs (/book/:slug, /opd/:slug/appointment, /:slug/appointment)
# need no redirect rules of their own: this rule serves index.html and React
# Router resolves the shape. Keeping it that way means the vanity URLs behave
# identically in `netlify dev` and on both production domains.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# The public booking page ships as an embeddable widget, so clinic websites must
# be able to iframe it. Everything else keeps the browser default (same-origin).
[[headers]]
  for = "/book/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/opd/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false
