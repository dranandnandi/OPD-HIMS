[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# ---------------------------------------------------------------------------
# Automatic WhatsApp reminders
#
# queue-auto-reminders inserts due reminders; process-whatsapp-queue drains the
# queue one message at a time per clinic, honouring the 5-10 minute anti-ban gap
# configured per clinic. Both need SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in
# the site environment, alongside the existing WHATSAPP_* vars.
# ---------------------------------------------------------------------------

[functions."queue-auto-reminders"]
  schedule = "0 * * * *"

[functions."process-whatsapp-queue"]
  schedule = "*/5 * * * *"

# Don't redirect these patterns - let them pass through to Vite
[[redirects]]
  from = "/src/*"
  to = "http://localhost:5173/src/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@vite/*"
  to = "http://localhost:5173/@vite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@react-refresh"
  to = "http://localhost:5173/@react-refresh"
  status = 200
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "http://localhost:5173/node_modules/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/@id/*"
  to = "http://localhost:5173/@id/:splat"
  status = 200
  force = true

# SPA fallback - only for HTML navigation.
# Public booking URLs (/book/:slug, /opd/:slug/appointment, /:slug/appointment)
# need no redirect rules of their own: this rule serves index.html and React
# Router resolves the shape. Keeping it that way means the vanity URLs behave
# identically in `netlify dev` and on both production domains.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# The public booking page ships as an embeddable widget, so clinic websites must
# be able to iframe it. Everything else keeps the browser default (same-origin).
[[headers]]
  for = "/book/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/opd/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false
